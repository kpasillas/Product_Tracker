#cloud-config

############################
# 1. SYSTEM BOOTSTRAP
############################

package_update: true
package_upgrade: true

apt:
  sources:
    google-chrome:
      source: "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main"
      keyid: 78BD65473CB3BD13

packages:
  - software-properties-common
  - git
  - curl
  - ca-certificates
  - jq
  - google-chrome-stable
  - chromium-chromedriver

############################
# Users
############################
users:
  - default
  - name: kpasillas
    gecos: Product Tracker User
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: sudo
    lock_passwd: true

############################
# 3. write_files
############################

write_files:
  - path: /home/kpasillas/.env
    permissions: "0600"
    content: |
      MYSQL_USERNAME="${MYSQL_USERNAME}"
      MYSQL_PASSWORD="${MYSQL_PASSWORD}"
      MYSQL_HOST="${MYSQL_HOST}"
      NTFY_TOPIC="${NTFY_TOPIC}"

  - path: /usr/local/bin/setup-product-tracker.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      USER="kpasillas"
      HOME="/home/${USER}"
      APP_DIR="${HOME}/Product_Tracker"

      echo "=== Setup Product Tracker Starting ==="

      # Baked in at render time by envsubst
      NTFY_TOPIC="${NTFY_TOPIC}"

      # Send ntfy notification (best-effort — never fail the script)
      ntfy_notify() {
        local title="$1"
        local msg="$2"
        # Still best-effort, but not silent: the box is deleted right after the
        # run, so this journal line is the only evidence a publish was refused.
        local code
        code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
          -H "Title: ${title}" \
          -H "Priority: default" \
          -d "${msg}" \
          "https://ntfy.sh/${NTFY_TOPIC}") || code="curl-exit-$?"
        echo "ntfy: ${code} ${title}"
      }

      # Notify on unexpected failure
      trap 'ntfy_notify "❌ Product Tracker Failed Setup" "Script failed at $(date -u)"' ERR

      ntfy_notify "🎬 Product Tracker" "Started at $(date -u)"

      if [[ "$HOME" != "/home/kpasillas" ]]; then
        echo "ERROR: Incorrect HOME detected: $HOME"
        exit 1
      fi

      # Baked in at render time by envsubst
      TAILSCALE_AUTHKEY="${TAILSCALE_AUTHKEY}"

      echo "Install & connect Tailscale - Start"
      # Never pipe a fetch straight into a shell: without -f, an HTTP error body
      # gets executed as a script. Download, let -f fail loudly, then run.
      curl -fsSL https://tailscale.com/install.sh -o /tmp/ts-install.sh
      sh /tmp/ts-install.sh
      sudo tailscale up --authkey="${TAILSCALE_AUTHKEY}" --hostname="product-tracker-scraper"
      echo "Install & connect Tailscale - Finish"

      echo "Install Python - Start"
      # apt from Linode's in-datacenter mirror, not GitHub: pyenv fetched its
      # installer from raw.githubusercontent, which throttles shared cloud egress.
      # Launchpad's key API 500s intermittently (GPGKeyTemporarilyNotFoundError),
      # which kills the whole boot. Retry before giving up.
      for i in 1 2 3 4 5; do
        sudo add-apt-repository -y ppa:deadsnakes/ppa && break
        echo "add-apt-repository failed (attempt $i), retrying in $((i * 15))s"
        sleep $((i * 15))
      done
      sudo apt-get install -y python3.13 python3.13-venv
      echo "Install Python - Finish"

      echo "Git Clone - Start"
      sudo -u "${USER}" git clone https://github.com/kpasillas/Product_Tracker.git "${APP_DIR}"
      echo "Git Clone - Finish"

      mv ${HOME}/.env ${APP_DIR}

      echo "Setup venv - Start"
      cd ${APP_DIR}
      echo "Create venv"
      python3.13 -m venv .venv
      echo "Activate venv"
      source .venv/bin/activate
      echo "Install pip packages"
      pip install --upgrade pip
      pip install -r requirements.txt
      echo "Setup venv - Finish"

      # ---- Setup marker ----
      touch "$HOME/.setup_product_tracker_done"

      echo "=== Setup Product Tracker Complete ==="

  - path: /etc/systemd/system/setup-product-tracker.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Setup Product Tracker
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      User=kpasillas
      Environment=HOME=/home/kpasillas
      ExecStart=/bin/bash -lc /usr/local/bin/setup-product-tracker.sh

      [Install]
      WantedBy=multi-user.target

  - path: /usr/local/bin/run-product-tracker.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      # -----------------------------
      # Linode metadata helpers
      # -----------------------------
      
      get_metadata_token() {
        curl -s -f -X PUT \
          -H "Metadata-Token-Expiry-Seconds: 300" \
          http://169.254.169.254/v1/token
      }
      
      get_instance_metadata() {
        local token="$1"
        curl -s -f \
          -H "Metadata-Token: ${token}" \
          -H "Accept: application/json" \
          http://169.254.169.254/v1/instance
      }
      
      export LINODE_CLI_TOKEN="${LINODE_TOKEN}"

      USER="kpasillas"
      HOME="/home/${USER}"
      APP_DIR="${HOME}/Product_Tracker"

      export HOME
      cd "${APP_DIR}"

      # Baked in at render time by envsubst
      NTFY_TOPIC="${NTFY_TOPIC}"

      # Send ntfy notification (best-effort — never fail the script)
      ntfy_notify() {
        local title="$1"
        local msg="$2"
        # Still best-effort, but not silent: the box is deleted right after the
        # run, so this journal line is the only evidence a publish was refused.
        local code
        code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
          -H "Title: ${title}" \
          -H "Priority: default" \
          -d "${msg}" \
          "https://ntfy.sh/${NTFY_TOPIC}") || code="curl-exit-$?"
        echo "ntfy: ${code} ${title}"
      }

      # Notify on unexpected failure
      trap 'ntfy_notify "❌ Product Tracker Failed" "Script failed at $(date -u)"' ERR

      source .venv/bin/activate

      python run_product_tracker.py

      touch /run/product-tracker/completed

      echo "🏁 Product tracker finished"
      
      echo "Fetching Linode metadata..."

      # Label matching deleted the wrong box when a stray or concurrent run existed.
      # Fail soft: an empty ID falls through to the else branch below, which alerts.
      METADATA_TOKEN="$(get_metadata_token || true)"
      LINODE_ID="$(get_instance_metadata "$METADATA_TOKEN" | jq -r '.id // empty' || true)"

      echo "Linode ID: $LINODE_ID"

      echo "🔥 Deleting Linode ID: $LINODE_ID"
      
      if [[ -n "$LINODE_ID" ]]; then
        ntfy_notify "✅ Product Tracker" "Completed successfully at $(date -u)"
        echo "Destroying Linode $LINODE_ID"
        linode-cli linodes delete "$LINODE_ID"
      else
        echo "ERROR: LINODE_ID not set — skipping self-destruction"
        ntfy_notify "❌ Product Tracker" "Linode failed to self-destruct at $(date -u)"
      fi

  - path: /etc/systemd/system/run-product-tracker.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Run Product Tracker
      After=network-online.target
      Wants=network-online.target
      
      [Service]
      Type=oneshot
      RemainAfterExit=no
      Restart=no
      User=kpasillas
      Environment=HOME=/home/kpasillas
      RuntimeDirectory=product-tracker
      RuntimeDirectoryMode=0700
      Environment=XDG_RUNTIME_DIR=/run/product-tracker
      ExecStart=/usr/local/bin/run-product-tracker.sh
      StandardOutput=journal
      StandardError=journal
      PrivateTmp=false
      ProtectHome=false
      
      [Install]
      WantedBy=multi-user.target


############################
# 5. EXECUTION + REBOOT LOGIC
############################

runcmd:
  - echo "runcmd - Start"

  - shutdown -h +360

  - chown -R kpasillas:kpasillas /home/kpasillas
  - chmod 0755 /usr/local/bin/run-product-tracker.sh
  - chown root:root /usr/local/bin/run-product-tracker.sh

  
  - echo "product-tracker.service - Start"
  
  - systemctl daemon-reload
  
  - systemctl enable setup-product-tracker.service
  - systemctl start setup-product-tracker.service

  - systemctl enable run-product-tracker.service
  - systemctl start run-product-tracker.service
  
  - echo "product-tracker.service - Finish"

  - echo "runcmd - Finish"
