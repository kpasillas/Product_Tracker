name: Run Product Tracker (Linode)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 20 * * *"
    - cron: "0 1 * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    environment: env

    steps:
      - uses: actions/checkout@v4

      # --------------------------------------------------
      # 1. Render cloud-init with secrets
      # --------------------------------------------------
      - name: Render cloud-init
        env:
          LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          envsubst '${LINODE_TOKEN} ${MYSQL_USERNAME} ${MYSQL_PASSWORD} ${MYSQL_HOST} ${NTFY_TOPIC} ${NTFY_TOKEN} ${TAILSCALE_AUTHKEY}' \
            < cloud-init/cloud-init_template.yaml \
            > cloud-init/cloud-init.yaml


      
      # --------------------------------------------------
      # 2. Generate SSH key
      # --------------------------------------------------
      - name: Generate SSH key
        run: |
          ssh-keygen -t ed25519 -f /tmp/linode_ssh -N ""


      # --------------------------------------------------
      # 3. Install Linode CLI
      # --------------------------------------------------
      - name: Install Linode CLI
        uses: linode/action-linode-cli@v1.1.0
        with:
          token: ${{ secrets.LINODE_TOKEN }}

      # --------------------------------------------------
      # 4. Deploy Linode with cloud-init user data
      # --------------------------------------------------
      - name: Deploy Linode with cloud-init user data
        id: create
        run: |
          LINODE_JSON=$(linode-cli linodes create \
            --root_pass "${{ secrets.ROOT_PASSWORD }}" \
            --image "linode/ubuntu22.04" \
            --region "us-lax" \
            --type "g6-nanode-1" \
            --label "product-tracker-${{ github.run_id }}" \
            --authorized_keys "$(cat /tmp/linode_ssh.pub)" \
            --metadata.user_data "$(base64 -w 0 cloud-init/cloud-init.yaml)" \
            --json)
      
          LINODE_ID=$(echo "$LINODE_JSON" | jq -r '.[0].id')
          LINODE_IP=$(echo "$LINODE_JSON" | jq -r '.[0].ipv4[0]')
      
          echo "LINODE_ID=$LINODE_ID" >> $GITHUB_ENV
          echo "LINODE_IP=$LINODE_IP" >> $GITHUB_ENV

      # --------------------------------------------------
      # 5. Wait for SSH
      # --------------------------------------------------
      - name: Wait for SSH
        run: |
          for i in {1..60}; do
            if ssh -i /tmp/linode_ssh \
                  -o StrictHostKeyChecking=no \
                  -o ConnectTimeout=5 \
                  root@"$LINODE_IP" "echo SSH ready"; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      # --------------------------------------------------
      # 6. Wait for cloud-init setup to finish
      # --------------------------------------------------
      # SSH answering only means sshd is up — cloud-init keeps running for
      # minutes afterwards. Without this gate the job reports success even
      # when setup dies, so a broken build looks identical to a good one.
      - name: Wait for setup to succeed
        run: |
          ssh_vm() {
            ssh -i /tmp/linode_ssh \
                -o StrictHostKeyChecking=no \
                -o ConnectTimeout=5 \
                root@"$LINODE_IP" "$1"
          }

          # The box is deleted on failure, so this dump is the only forensics
          # that survives. pip's download spam can fill 60 lines on its own —
          # drop it so the actual steps stay visible.
          dump_journal() {
            ssh_vm 'journalctl -u setup-product-tracker.service --no-pager \
                      | grep -vE "Downloading |[0-9.]+/[0-9.]+ [kMG]B|━" \
                      | tail -60' || true
          }

          # One round trip per poll. systemd is the source of truth for
          # failure: a crash lands in "failed" rather than just never
          # producing the marker.
          probe='
            if systemctl is-failed --quiet setup-product-tracker.service; then
              echo FAILED
            elif test -f /home/kpasillas/.setup_product_tracker_done; then
              echo DONE
            else
              echo WAIT
            fi'

          # Setup is wildly variable: two consecutive runs measured 5 min and
          # 18+ min for the same code, depending on apt/pip mirror speed and
          # whether the deadsnakes retry burns its backoff. Budget for the bad
          # day — a false red is worse than waiting on a genuinely dead box.
          for i in {1..120}; do
            case "$(ssh_vm "$probe" 2>/dev/null)" in
              DONE)
                echo "Setup completed after ~$((i * 15))s"
                # The box self-destructs, so this is the only chance to see
                # whether ntfy actually accepted the publish (200) or refused
                # it (400 bad topic, 403 auth, 429 rate limit).
                ssh_vm 'journalctl -u setup-product-tracker.service --no-pager \
                          | grep "ntfy:"' || true
                exit 0
                ;;
              FAILED)
                echo "::error::setup-product-tracker.service failed"
                dump_journal
                exit 1
                ;;
            esac
            sleep 15
          done

          echo "::error::setup did not finish within 30 minutes"
          dump_journal
          exit 1

      # --------------------------------------------------
      # 7. Clean up a Linode that will never clean itself up
      # --------------------------------------------------
      # Self-destruct lives at the end of the *run* script, so any failure
      # before that strands a billing nanode. Delete by the id captured at
      # create time, never by label — label matching has deleted the wrong
      # box when a stray or concurrent run existed.
      - name: Delete Linode on failure
        if: failure() && env.LINODE_ID != ''
        run: |
          echo "Deleting orphaned Linode $LINODE_ID"
          linode-cli linodes delete "$LINODE_ID"
